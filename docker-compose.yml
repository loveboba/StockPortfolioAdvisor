services: 

  frontend: 
    build: ./frontend 
    ports: 
     - "3000: 80"
    depends_on: 
      - backend 
  
  backend: 
    build: ./backend 
    ports: 
      - "8000: 8000"
    environment: 
      DATABASE_URL: 
    depends_on: 
     - db 
  
  db: 
    image: postgres:16
    environment: 
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgress
      POSTGRES_DB: dockerDatabase
    volumes: 
      - postgres_data:/var/lib/postgresql/data 
    ports: 
      - "5432: 5432"

volumes: 
  postgres_data: 
